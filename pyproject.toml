[tool.poetry]
package-mode = false

[project]
name = "crossword-flask"
version = "0.1.0"
description = "A Flask-based crossword puzzle generator"
authors = [
    {name = "Joel"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-wtf (>=1.2.2,<2.0.0)",
    "pillow (>=12.0.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
